name: Development-Pipeline
on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  PROPERTIES_ENCRYPTION_KEY: ${{secrets.PROPERTIES_ENCRYPTION_KEY}}
  REPOSITORY_PASSWORD: ${{secrets.REPOSITORY_PASSWORD}}
  NODE_AUTH_TOKEN: ${{secrets.NODE_AUTH_TOKEN}}
  #REPOSITORY_USER: must be set in GitHub variables

jobs:
  run-commit-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'corretto'

      - name: Chmod GradleW
        run: chmod a+x gradlew

      - name: Build Java with Gradle
        uses: gradle/gradle-build-action@749f47bda3e44aa060e82d7b3ef7e40d953bd629
        with:
          gradle-executable: gradlew
          arguments: build

      - name: Publish Test Report (Commit Stage)
        uses: mikepenz/action-junit-report@v3
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/.build/test-results/test/TEST-*.xml'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20.5.1'
          registry-url: 'https://registry.npmjs.org/'

      - name: Configure npm/yarn retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          yarn config set network-timeout 600000 -g
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      - name: Build Typescript with Yarn
        run: yarn run test
        env:
          NODE_AUTH_TOKEN: ${{secrets.NODE_AUTH_TOKEN}}

      - name: Commit package.json with New Version
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git add Components/Strata.Client.Core/src/main/typescript/package.json
          git add Components/Strata.Client.React/src/main/typescript/package.json
          git commit -m "strata.client.* package.json new version"
          git push origin development

