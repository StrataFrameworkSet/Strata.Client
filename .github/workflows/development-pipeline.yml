  java-deploy-stage:
    runs-on: ubuntu-latest
    needs: java-commit-stage
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Chmod GradleW
        run: chmod a+x gradlew

      - name: Chmod GradleW
        run: chmod a+x gradlew

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Publish Build Artifacts
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -x test -x build -x jar -x compileJava -x processResources -x classes -x testJar -x testFixturesJar -x testClasses -x testFixturesClasses


