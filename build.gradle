project.buildDir = ".build";
wrapper.jarFile = ".gradle/wrapper/gradle-wrapper.jar"

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(22)
            vendor = JvmVendorSpec.AMAZON
        }
    }

    compileJava {
        options.release = 22
    }

    compileTestJava {
        options.release = 22
    }
}

ext {
    springboot_version = "3.1.3"
    hibernate_version = "5.6.11.Final"
    major = "1"
    minor = ".0"
    patch = "-SNAPSHOT"
}

group 'strata.client'
version "$major$minor$patch"
