plugins {
    id 'java-library'
}

sourceSets {
    main.java.srcDirs = ['src/main/java']
    test.java.srcDirs = ['src/unused']
}

group 'strata.client'
version "$major$minor$patch"

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
}

dependencies {
    api project(':Components:Strata.Client.Core')
}
