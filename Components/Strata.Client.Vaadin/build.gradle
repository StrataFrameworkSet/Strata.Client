plugins {
    id 'java-library'
}

sourceSets {
    main.java.srcDirs = ['src/main/java']
    main.resources.srcDirs = ['src/main/resources']
    test.java.srcDirs = ['src/unused']
}

group 'strata.client'

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
}

dependencies {
    api project(':Components:Strata.Client.Core')
    api "strata.foundation:strata-foundation-core:$strata_foundation_version"
    implementation "com.vaadin:flow-server:$vaadin_version"
    //api "jakarta.ws.rs:jakarta.ws.rs-api:$jakarta_ws_rs_version"
    //api "com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-json-provider:$jackson_version"
}
